name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Valore fittizio: config.toml abilita Twilio solo per il login con i numeri di test (nessun SMS reale).
env:
  SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: solo-ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm ai:check
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Avvia Supabase locale (solo servizi necessari ai test)
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      - name: Tipi DB allineati alle migrazioni
        run: |
          supabase gen types typescript --local --schema public > database.generated.ts
          diff -u src/types/database.ts database.generated.ts
      - name: Carica i tipi generati (da committare in src/types/database.ts)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: database.generated.ts
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - name: Avvia Supabase locale (DB, Auth, API)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Variabili dell'app dallo stack locale
        run: |
          supabase status -o json > status.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL status.json)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .ANON_KEY status.json)"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SERVICE_ROLE_KEY status.json)"
          } >> "$GITHUB_ENV"
          rm status.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
        env:
          CI: true
          # Rate limit in memoria e chiave HMAC di sviluppo ammessi solo con ARENGO_ENV=ci.
          ARENGO_ENV: ci
      - name: Report Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
